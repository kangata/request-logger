name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', testbench: '^4.0' }  # Laravel 6
          - { php: '7.4', testbench: '^5.0' }  # Laravel 7
          - { php: '7.4', testbench: '^6.0' }  # Laravel 8
          - { php: '8.0', testbench: '^6.0' }
          - { php: '8.0', testbench: '^7.0' }  # Laravel 9
          - { php: '8.1', testbench: '^7.0' }
          - { php: '8.1', testbench: '^8.0' }  # Laravel 10
          - { php: '8.2', testbench: '^8.0' }
          - { php: '8.2', testbench: '^9.0' }  # Laravel 11
          - { php: '8.3', testbench: '^9.0' }
          - { php: '8.3', testbench: '^10.0' } # Laravel 12
          - { php: '8.4', testbench: '^10.0' }
          - { php: '8.4', testbench: '^11.0' } # Laravel 13
          - { php: '8.5', testbench: '^11.0' }
    name: PHP ${{ matrix.php }} / testbench ${{ matrix.testbench }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
